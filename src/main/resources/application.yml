spring:
  application:
    name: chainee
  profiles:
    active: prod  # 필요시 dev로 바꾸되, dev/prod 모두 이 설정 사용

  datasource:
    url: jdbc:mysql://localhost:3306/chainee?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  h2:
    console:
      enabled: false  # 필요 없으니 false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  port: 8080
