spring:
  datasource:
    url: jdbc:h2:mem:chainee;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        hbm2ddl.auto: create
        globally_quoted_identifiers: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    issuer: http://localhost:8080
    audience: chainee-local
    access-ttl: 15m
    refresh-ttl: 14d
    clock-skew: 30s
    refresh-cookie-name: refresh_token
    cookie:
      secure: false     # 로컬은 http라 false
      same-site: Lax