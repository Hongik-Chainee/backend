spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chainee?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: chainee
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
app:
  jwt:
    issuer: https://chainee.store
    audience: chainee
    access-ttl: 15m         # Access 토큰 만료 (Duration 문법 지원: 15m, 1h, 900s 등)
    refresh-ttl: 14d        # Refresh 토큰 만료 (짧은 access를 안전하게 굴리면서 세션을 이어가고, 서버가 세션을 통제/차단하고, 상태변화(kyc/did)를 재발급 시점에 access에 반영하려고 필요)
    clock-skew: 30s         # 허용 시계 오차
    refresh-cookie-name: refresh_token
    cookie:
      secure: true
      same-site: Lax

  frontend-baseurls:
    - http://localhost:3000
    - https://app.chainee.store

  oauth2:
    callback-path: /auth/callback