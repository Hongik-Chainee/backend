spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chainee?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: chainee
    password: ${DB_PASSWORD}  # 운영 환경은 무조건 환경변수 사용

  jpa:
    hibernate:
      ddl-auto: update  # 운영 환경에서는 위험 시 validate 또는 none 사용 고려
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
