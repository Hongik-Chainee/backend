name: Java Spring Boot CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 실행 가능한 bootJar만 빌드 (plain 제외)
      - name: Build (bootJar, prod)
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -Pspring.profiles.active=prod

      # plain/original 제거하고 최신 bootJar 선택
      - name: Locate executable JAR (exclude -plain)
        id: get_jar
        run: |
          set -e
          JAR_FILE=$(ls -t build/libs/*.jar | grep -v -E 'plain|original' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No executable boot JAR found"; exit 1
          fi
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Using: $JAR_FILE"

      - name: Add EC2 Host Key to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_HOST_KEYS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # JAR은 releases 폴더로 업로드(서비스 파일과 분리)
      - name: Upload JAR to EC2 (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ steps.get_jar.outputs.jar }}
          target: /home/${{ secrets.SSH_USER }}/chainee/releases/
          strip_components: 2
          overwrite: true
          timeout: 120s

      # 서비스 중단 → 대상 경로로 덮어쓰기 → 재기동
      - name: Deploy & Restart on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            HOME_DIR="/home/${{ secrets.SSH_USER }}"
            REL_DIR="$HOME_DIR/chainee/releases"
            DEPLOY_DIR="$HOME_DIR/chainee/build/libs"
            TARGET_JAR="$DEPLOY_DIR/chainee-0.0.1-SNAPSHOT.jar"

            echo "Pick latest boot JAR (exclude plain/original)..."
            LATEST_JAR=$(ls -t "$REL_DIR"/*.jar | grep -v -E 'plain|original' | head -n 1 || true)
            if [ -z "$LATEST_JAR" ]; then
              echo "No JAR found in $REL_DIR"; exit 1
            fi
            echo "Latest: $LATEST_JAR"

            echo "Stopping service..."
            sudo systemctl stop chainee-backend || true

            # 최대 10초 대기하며 완전 정지 확인(실패로 간주하지 않음)
            for i in {1..10}; do
              if ! systemctl is-active --quiet chainee-backend; then
                echo "Service stopped."; break
              fi
              sleep 1
            done

            echo "Prepare deploy dir..."
            mkdir -p "$DEPLOY_DIR"

            echo "Overwrite target JAR (systemd ExecStart path)..."
            cp -f "$LATEST_JAR" "$TARGET_JAR"
            sudo chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} "$TARGET_JAR"
            sudo chmod +x "$TARGET_JAR"

            # releases 폴더는 최신 1개만 유지(누적 방지)
            ls -t "$REL_DIR"/*.jar | tail -n +2 | xargs -r rm -f || true

            echo "Start service..."
            sudo systemctl daemon-reload || true
            sudo systemctl start chainee-backend

            echo "Service status (non-blocking):"
            sudo systemctl status chainee-backend --no-pager || true
            echo "Last logs (non-blocking):"
            sudo journalctl -u chainee-backend -n 80 --no-pager || true
