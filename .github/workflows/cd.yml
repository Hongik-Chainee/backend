name: Java Spring Boot CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build (bootJar, prod)
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -Pspring.profiles.active=prod

      - name: Locate executable JAR (exclude -plain)
        id: get_jar
        run: |
          set -e
          JAR_FILE=$(ls -t build/libs/*.jar | grep -v -E 'plain|original' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No executable boot JAR found"; exit 1
          fi
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Using: $JAR_FILE"

      - name: Add EC2 Host Key to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_HOST_KEYS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload JAR to EC2 (staging)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ steps.get_jar.outputs.jar }}
          target: /home/${{ secrets.SSH_USER }}/chainee/releases/
          strip_components: 2
          overwrite: true
          timeout: 120s

      - name: Deploy & Restart on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eux
            REL_DIR="/home/${{ secrets.SSH_USER }}/chainee/releases"
            TARGET_JAR="/home/${{ secrets.SSH_USER }}/chainee/build/libs/chainee-0.0.1-SNAPSHOT.jar"
            LATEST_JAR=$(ls -t "$REL_DIR"/*.jar | head -n 1)

            echo "Stopping service..."
            sudo systemctl stop chainee-backend || true
            pkill -f 'java.*chainee' || true

            # 보관 경로 존재 보장
            mkdir -p "$(dirname "$TARGET_JAR")"

            # 유닛이 바라보는 파일로 '덮어쓰기' 배포
            cp -f "$LATEST_JAR" "$TARGET_JAR"
            sudo chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} "$TARGET_JAR"
            sudo chmod +x "$TARGET_JAR"

            # releases 폴더는 최신 1개만 보존(누적 방지)
            (ls -t "$REL_DIR"/*.jar | tail -n +2 | xargs -r rm -f)

            echo "Starting service..."
            sudo systemctl daemon-reload
            sudo systemctl start chainee-backend

            echo "Service status:"
            sudo systemctl status chainee-backend --no-pager || true
            echo "Last logs:"
            sudo journalctl -u chainee-backend -n 80 --no-pager || true
