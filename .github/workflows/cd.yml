name: Java Spring Boot CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR for Production
        run: |
          chmod +x gradlew
          ./gradlew clean assemble -Pspring.profiles.active=prod

      - name: Locate and Prepare JAR artifact
        id: get_jar_path
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No executable JAR file found!"
            exit 1
          fi
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Transfer JAR to EC2 Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ steps.get_jar_path.outputs.jar_path }}
          target: /home/${{ secrets.SSH_USER }}/chainee/build/libs/
          strip_components: 2
          insecure: true

      - name: Deploy and Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eux

            echo "Stopping existing chainee-backend service..."
            sudo systemctl stop chainee-backend || true

            DEPLOY_DIR="/home/${{ secrets.SSH_USER }}/chainee/build/libs"
            JAR_NAME=$(ls $DEPLOY_DIR/*.jar | head -n 1)
            sudo chmod +x "$JAR_NAME"

            echo "Starting chainee-backend service..."
            sudo systemctl start chainee-backend

            echo "Checking service status..."
            sudo systemctl status chainee-backend --no-pager || true
